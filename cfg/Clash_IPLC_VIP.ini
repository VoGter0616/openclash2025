[custom]

; ==========================================================
; IPLC.VIP订阅专用转换
; ==========================================================
; ==========================================================
; 规则生成器
; ==========================================================
enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 规则（自上而下金字塔优先级）
; ==========================================================

; --- 1. 最高优先级：本地私网与局域网直连 ---
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve

; --- 2. 核心直连防线：阿里系服务、国内银行、金融、IoT ---
ruleset=DIRECT,[]GEOSITE,alibaba
ruleset=DIRECT,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Merged/Direct_Merged.list

; --- 3. 核心代理防线：AI 专项 ---
ruleset=🧠 AI,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Merged/AI_Merged.list
ruleset=🧠 AI,[]GEOSITE,category-ai-!cn

; --- 4. 核心直连防线：国内大流量下载及游戏域名直连与手动直连补丁 ---
ruleset=DIRECT,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Merged/CDN_Merged.list
ruleset=DIRECT,[]GEOSITE,category-games@cn
ruleset=DIRECT,[]GEOSITE,category-game-platforms-download

; ==========================================================
; 精细化应用分流区域（匹配特定软件与服务）
; ==========================================================

; --- 社交 & 通讯 ---
ruleset=📱 社交,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Merged/Social_Merged.list
ruleset=📱 社交,[]GEOSITE,category-communication
ruleset=📱 社交,[]GEOSITE,category-social-media-!cn
ruleset=📱 社交,[]GEOIP,telegram,no-resolve
ruleset=📱 社交,[]GEOIP,facebook,no-resolve
ruleset=📱 社交,[]GEOIP,twitter,no-resolve

; --- 影音流媒体 ---
ruleset=🎞️ YouTube,[]GEOSITE,youtube
;YouTube 核心视频流及内容补丁
ruleset=🎞️ YouTube,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Clash/YouTube_Video.list
ruleset=🎥 Netflix,[]GEOSITE,netflix
ruleset=🎥 Netflix,[]GEOIP,netflix,no-resolve
ruleset=🎵 Spotify,[]GEOSITE,spotify
ruleset=🎶 TikTok,[]GEOSITE,tiktok
ruleset=🎬 Disney+,[]GEOSITE,disney
ruleset=🎥 HBO,[]GEOSITE,hbo
ruleset=📺 Bahamut,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Bahamut/Bahamut.list

; --- 谷歌专项 ---
ruleset=🇬 Google,[]GEOSITE,google
ruleset=🇬 Google,[]GEOIP,google,no-resolve

; --- 开发 & 常用工具 ---
ruleset=📘 GitHub,[]GEOSITE,github
ruleset=Ⓜ️ Microsoft,[]GEOSITE,microsoft
ruleset=🍎 Apple,[]GEOSITE,apple
ruleset=Ⓜ️ OneDrive,[]GEOSITE,onedrive
ruleset=🚝 测速工具,[]GEOSITE,category-speedtest
ruleset=🟥 Adobe,[]GEOSITE,adobe
ruleset=🟥 Adobe,[]GEOSITE,adobe-activation

; --- 游戏联机 ---
ruleset=🎮 Steam,[]GEOSITE,steam
ruleset=🕹️ 游戏,[]GEOSITE,category-games

; --- 功能组与非标端口 ---
ruleset=PROXY,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Clash/Global_DNS.list
ruleset=🏠 我的群晖,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Clash/Synology_Proxy.list
ruleset=🔀 非标端口,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Clash/Custom_Port.list
ruleset=🌎 国外媒体,[]GEOSITE,category-entertainment

; ==========================================================
; 兜底拦截网
; ==========================================================

; --- 国外通用域名大包兜底 ---
ruleset=🌍 国外,[]GEOSITE,geolocation-!cn
ruleset=🌍 国外,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Merged/Proxy_Merged.list

; --- 基础国内直连大包兜底 ---
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn,no-resolve

; --- 漏网之鱼 ---
ruleset=🐟 漏网之鱼,[]FINAL

; ==========================================================
; 节点清洗：剔除机场展示/说明/防失联/流量提示节点
; ==========================================================
exclude=「官 网」iplc.vip|仅海外用户
; ==========================================================
; 节点池
; ==========================================================
custom_proxy_group=🧭 手动选择`select`.*
custom_proxy_group=♻️ 自动选择`url-test`(?i)(香港|新加坡|台湾省)`https://cp.cloudflare.com/generate_204`600,,50
custom_proxy_group=🧱 稳定兜底`fallback`(?i)(香港|日本|新加坡|台湾省|美国|菲律宾)`https://www.gstatic.com/generate_204`300
custom_proxy_group=🧪 测试节点`select`(?i)(TW|JP|US)`https://cp.cloudflare.com/generate_204`600,,50
custom_proxy_group=香港-自动`url-test`(香港)`https://cp.cloudflare.com/generate_204`400,,100
custom_proxy_group=台湾-自动`url-test`(台湾省)`https://cp.cloudflare.com/generate_204`400,,100
custom_proxy_group=日本-自动`url-test`(日本)`https://cp.cloudflare.com/generate_204`400,,100
custom_proxy_group=菲律宾-自动`url-test`(菲律宾)`https://cp.cloudflare.com/generate_204`400,,100
custom_proxy_group=新加坡-自动`url-test`(新加坡)`https://cp.cloudflare.com/generate_204`400,,100
custom_proxy_group=美国-自动`url-test`(美国)`https://cp.cloudflare.com/generate_204`400,,100
custom_proxy_group=🌍 冷门节点`select`(韩|波|柬|尼|也|克|比|尔|立|冰|秘|耳|利|埃|希|孟|芬|愛|澳|英|德|南|意|法|拿|墨|印|越|俄|瑞|智|荷|比|巴|沙|班|泰|德|烏|以|Australia|Konghwaguk)`https://cp.cloudflare.com/generate_204`300

; --- AI 相关
custom_proxy_group=🧠 AI`select`[]新加坡-自动`[]美国-自动`[]台湾-自动`[]日本-自动`[]🧭 手动选择`[]DIRECT

; --- 业务专用组
custom_proxy_group=PROXY`fallback`[]香港-自动`[]新加坡-自动`[]美国-自动`[]🧱 稳定兜底`https://1.1.1.1/generate_204`180
custom_proxy_group=🏠 我的群晖`select`[]DIRECT`[]香港-自动`[]台湾-自动`[]新加坡-自动`[]🧭 手动选择

; --- 流媒体
custom_proxy_group=🎞️ YouTube`select`[]香港-自动`[]台湾-自动`[]新加坡-自动`[]美国-自动`[]日本-自动`[]菲律宾-自动`[]🌍 冷门节点`[]🧭 手动选择`[]DIRECT
custom_proxy_group=🎵 Spotify`select`[]香港-自动`[]台湾-自动`[]新加坡-自动`[]美国-自动`[]日本-自动`[]菲律宾-自动`[]🌍 冷门节点`[]🧭 手动选择`[]DIRECT
custom_proxy_group=🎥 Netflix`select`[]香港-自动`[]台湾-自动`[]新加坡-自动`[]美国-自动`[]日本-自动`[]菲律宾-自动`[]🌍 冷门节点`[]🧭 手动选择`[]DIRECT
custom_proxy_group=🎬 Disney+`select`[]香港-自动`[]台湾-自动`[]新加坡-自动`[]美国-自动`[]日本-自动`[]菲律宾-自动`[]🌍 冷门节点`[]🧭 手动选择`[]DIRECT
custom_proxy_group=🎥 HBO`select`[]香港-自动`[]台湾-自动`[]日本-自动`[]菲律宾-自动`[]新加坡-自动`[]美国-自动`[]🌍 冷门节点`[]🧭 手动选择`[]DIRECT
custom_proxy_group=🌎 国外媒体`select`[]香港-自动`[]台湾-自动`[]日本-自动`[]菲律宾-自动`[]新加坡-自动`[]美国-自动`[]🌍 冷门节点`[]🧭 手动选择`[]DIRECT
custom_proxy_group=📺 Bahamut`select`[]台湾-自动`[]🧭 手动选择`[]DIRECT

; --- 短视频 & 社交
custom_proxy_group=🎶 TikTok`select`[]香港-自动`[]台湾-自动`[]日本-自动`[]菲律宾-自动`[]新加坡-自动`[]美国-自动`[]🌍 冷门节点`[]🧭 手动选择`[]DIRECT
custom_proxy_group=📱 社交`select`[]香港-自动`[]新加坡-自动`[]日本-自动`[]台湾-自动`[]韩国-自动`[]美国-自动`[]🌍 冷门节点`[]🧭 手动选择`[]DIRECT

; --- 开发者工具 / 技术网站
custom_proxy_group=📘 GitHub`select`[]香港-自动`[]台湾-自动`[]新加坡-自动`[]美国-自动`[]日本-自动`[]菲律宾-自动`[]🧭 手动选择`[]DIRECT
custom_proxy_group=🇬 Google`select`[]香港-自动`[]台湾-自动`[]新加坡-自动`[]美国-自动`[]日本-自动`[]菲律宾-自动`[]🧭 手动选择`[]DIRECT
custom_proxy_group=Ⓜ️ OneDrive`select`[]DIRECT`[]香港-自动`[]美国-自动`[]新加坡-自动`[]🧭 手动选择
custom_proxy_group=Ⓜ️ Microsoft`select`[]DIRECT`[]香港-自动`[]美国-自动`[]新加坡-自动`[]🧭 手动选择
custom_proxy_group=🍎 Apple`select`[]DIRECT`[]香港-自动`[]美国-自动`[]新加坡-自动`[]🧭 手动选择
custom_proxy_group=🚝 测速工具`select`[]DIRECT`[]香港-自动`[]台湾-自动`[]日本-自动`[]菲律宾-自动`[]新加坡-自动`[]美国-自动`[]🌍 冷门节点`[]🧭 手动选择

; --- 游戏类
custom_proxy_group=🎮 Steam`select`[]香港-自动`[]日本-自动`[]台湾-自动`[]新加坡-自动`[]美国-自动`[]🧭 手动选择`[]DIRECT
custom_proxy_group=🕹️ 游戏`select`[]日本-自动`[]香港-自动`[]新加坡-自动`[]美国-自动`[]🧭 手动选择`[]DIRECT

; Adobe：允许一键禁止联网
custom_proxy_group=🟥 Adobe`select`[]DIRECT`[]香港-自动`[]美国-自动`[]新加坡-自动`[]🧭 手动选择

; ==========================================================
; Default / 漏网之鱼
; ==========================================================
; Default 出口
custom_proxy_group=🌍 国外`fallback`[]♻️ 自动选择`[]🧱 稳定兜底`https://cp.cloudflare.com/generate_204`180
custom_proxy_group=🐟 漏网之鱼`select`[]🌍 国外`[]🧭 手动选择`[]DIRECT

; ==========================================================
; 非标端口
; ==========================================================
custom_proxy_group=🔀 非标端口`select`[]🐟 漏网之鱼`[]DIRECT
