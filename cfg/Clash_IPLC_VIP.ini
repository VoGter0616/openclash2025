[custom]
; IPLC.VIP订阅专用转换
; ==========================================================
; 规则生成器
; ==========================================================
enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 规则
; ==========================================================
; --- 1. 最高优先级：本地私网与局域网直连 ---
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve

; --- 2. 核心高频直连防线：国内巨头、高频服务、国内银行与小米IoT直连补丁 ---
ruleset=DIRECT,[]GEOSITE,alibaba
ruleset=DIRECT,[]GEOSITE,tencent
ruleset=DIRECT,[]GEOSITE,bytedance
ruleset=DIRECT,[]GEOSITE,baidu
ruleset=DIRECT,[]GEOSITE,huawei
ruleset=DIRECT,[]GEOSITE,xiaomi
ruleset=DIRECT,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Merged/Direct_Merged.list

; --- 3. 核心代理防线：DNS代理补丁 & AI 专项 ---
ruleset=PROXY,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Clash/Global_DNS.list
ruleset=🧠 AI,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Merged/AI_Merged.list

; --- 4. 核心直连防线：苹果/微软国内CDN、个人收集强制直连及游戏下载直连 ---
ruleset=DIRECT,[]GEOSITE,apple-cn
ruleset=DIRECT,[]GEOSITE,microsoft@cn
ruleset=DIRECT,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Merged/CDN_Merged.list
ruleset=DIRECT,[]GEOSITE,category-games@cn
ruleset=DIRECT,[]GEOSITE,category-game-platforms-download

; ==========================================================
; 精细化应用分流区域
; ==========================================================
; --- 社交 & 通讯 ---
ruleset=📱 社交,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Merged/Social_Merged.list
ruleset=📱 社交,[]GEOSITE,category-communication
ruleset=📱 社交,[]GEOSITE,category-social-media-!cn
ruleset=📱 社交,[]GEOIP,telegram,no-resolve
ruleset=📱 社交,[]GEOIP,facebook,no-resolve
ruleset=📱 社交,[]GEOIP,twitter,no-resolve

; --- 影音流媒体 ---
ruleset=🎞️ YouTube,[]GEOSITE,youtube
ruleset=🎞️ YouTube,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Clash/YouTube_Video.list
ruleset=🎥 Netflix,[]GEOSITE,netflix
ruleset=🎥 Netflix,[]GEOIP,netflix,no-resolve
ruleset=🎵 Spotify,[]GEOSITE,spotify
ruleset=🎶 TikTok,[]GEOSITE,tiktok
ruleset=🎬 Disney+,[]GEOSITE,disney
ruleset=🎥 HBO,[]GEOSITE,hbo
ruleset=📺 Bahamut,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Bahamut/Bahamut.list

; --- 谷歌专项 ---
ruleset=🇬 Google,[]GEOSITE,google
ruleset=🇬 Google,[]GEOIP,google,no-resolve

; --- 开发 & 常用工具 ---
ruleset=📘 GitHub,[]GEOSITE,github
ruleset=🚝 测速工具,[]GEOSITE,category-speedtest
ruleset=Ⓜ️ OneDrive,[]GEOSITE,onedrive
ruleset=Ⓜ️ Microsoft,[]GEOSITE,microsoft
ruleset=🍎 Apple,[]GEOSITE,apple
ruleset=🟥 Adobe,[]GEOSITE,adobe
ruleset=🟥 Adobe,[]GEOSITE,adobe-activation

; --- 游戏联机 ---
ruleset=🕹️ 游戏,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Merged/Game_Merged.list
ruleset=🕹️ 游戏,[]GEOSITE,category-games

; --- 功能组 ---
ruleset=🏠 我的群晖,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Clash/Synology_Proxy.list

; ==========================================================
; 兜底拦截网
; ==========================================================
; --- 国外通用域名大包兜底及个人收集强制代理补充补丁 ---
ruleset=🌍 国外,[]GEOSITE,geolocation-!cn
ruleset=🌍 国外,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Merged/Proxy_Merged.list

; --- 基础国内直连大包兜底 ---
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn,no-resolve

; --- 非标端口 ---
ruleset=🔀 非标端口,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Clash/Custom_Port_Direct.list

; --- 漏网之鱼 ---
ruleset=🐟 漏网之鱼,[]FINAL

; ==========================================================
; 节点策略组配置
; ==========================================================
; 1. 基础选择策略组
custom_proxy_group=🧭 手动选择-全部节点`select`.*
custom_proxy_group=🧭 手动选择-热门节点`select`(香港|菲律宾|新加坡|台湾|日本|美国)
custom_proxy_group=🧭 手动选择-冷门节点`select`(英国|韩国|澳洲|荷兰|德国|印度|巴西|法国|越南|埃及|泰国|印度尼西亚|迪拜|土耳其|阿根廷|加拿大|俄罗斯|以色列|意大利|西班牙|马来西亚|澳大利亚|巴基斯坦|哥伦比亚|尼日利亚)
custom_proxy_group=🧭 手动选择-测试节点`select`(TW|JP|US)
custom_proxy_group=♻️ 自动测速选择`url-test`(?i)(香港|新加坡|台湾)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🧱 兜底不断连`fallback`(?i)(香港|日本|新加坡|台湾|美国|菲律宾)`https://cp.cloudflare.com/generate_204`120,,30
custom_proxy_group=🧪 测试节点-自动测速`url-test`(?i)(TW|JP|US)`https://cp.cloudflare.com/generate_204`300,,50

; 2. 基础地区测速策略组
custom_proxy_group=🇭🇰 香港-自动测速`url-test`(香港)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇵🇭 菲律宾-自动测速`url-test`(菲律宾)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡-自动测速`url-test`(新加坡)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=台湾省-自动测速`url-test`(台湾)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本-自动测速`url-test`(日本)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国-自动测速`url-test`(美国)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🌍 冷门节点-自动测速`url-test`(英国|韩国|澳洲|荷兰|德国|印度|巴西|法国|越南|埃及|泰国|印度尼西亚|迪拜|土耳其|阿根廷|加拿大|俄罗斯|以色列|意大利|西班牙|马来西亚|澳大利亚|巴基斯坦|哥伦比亚|尼日利亚)`https://cp.cloudflare.com/generate_204`300,,50

