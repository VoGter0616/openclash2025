# ------------------ 自动规则池 (地区节点正则匹配) ------------------
# 测速间隔600秒，容差100ms，URL采用 Google 官方 204 测试源
香港-自动 = url-test, url=http://www.gstatic.com/generate_204, interval=600, tolerance=100, timeout=5, policy-regex-filter=(?=.*(港|HK|(?i)Hong))^((?!(台湾|日本|新加坡|美国|韩国|狮城|南朝鲜|US|SG|JP|KR|TW|台灣|美國|韓國|獅城)).)*$
台湾-自动 = url-test, url=http://www.gstatic.com/generate_204, interval=600, tolerance=100, timeout=5, policy-regex-filter=(?=.*(台|TW|(?i)Taiwan))^((?!(港|日|韩|新|美)).)*$
日本-自动 = url-test, url=http://www.gstatic.com/generate_204, interval=600, tolerance=100, timeout=5, policy-regex-filter=(?=.*(日本|JP|(?i)Japan))^((?!(香港|台湾|新加坡|美国|韩国|狮城|南朝鲜|US|SG|KR|HK|TW|台灣|美國|韓國|獅城)).)*$
韩国-自动 = url-test, url=http://www.gstatic.com/generate_204, interval=600, tolerance=100, timeout=5, policy-regex-filter=(?=.*(KR|Korea|KOR|首尔|韩|韓|(?i)Korea))^((?!(香港|台湾|新加坡|美国|狮城|南朝鲜|US|SG|HK|TW|台灣|美國|獅城)).)*$
新加坡-自动 = url-test, url=http://www.gstatic.com/generate_204, interval=600, tolerance=100, timeout=5, policy-regex-filter=(?=.*(新加坡|狮城|SG|(?i)Singapore))^((?!(香港|台湾|日本|美国|韩国|南朝鲜|US|JP|KR|HK|TW|台灣|美國|韓國)).)*$
美国-自动 = url-test, url=http://www.gstatic.com/generate_204, interval=600, tolerance=100, timeout=5, policy-regex-filter=(?=.*(美国|美國|US|洛杉矶|西雅图|(?i)States|American))^((?!(香港|台湾|日本|新加坡|韩国|狮城|南朝鲜|SG|JP|KR|HK|TW|台灣|韓國|獅城)).)*$
所有-自动 = url-test, url=http://www.gstatic.com/generate_204, interval=600, tolerance=100, timeout=5, policy-regex-filter=.*
所有-手动 = select


