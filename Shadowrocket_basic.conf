Ⓜ️ Microsoft = select, direct, 所有-自动, 香港-自动, 美国-自动, 所有-手动

# 兜底策略
PROXY = select, 香港-自动, 新加坡-自动, 日本-自动, 美国-自动, 所有-手动, direct

[Rule]

# 阻止 QUIC (UDP 443) 走意外路径，强制回退至 TCP 以确保分流稳定和加载速度
AND,((PROTOCOL,UDP),(DEST-PORT,443)),REJECT

