name: Update Gemini Rules
on:
  schedule:
    - cron: '0 4 * * *' # 每天北京时间 12:00 (UTC 4:00) 运行
  workflow_dispatch:      # 允许你随时手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 赋予写入仓库内容的权限
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          
      - name: Run Merge Script
        run: python .github/py/merge_gemini.py
        
      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # 清理可能残留的旧路径文件（防止历史文件遗留）
          git rm -f Gemini_Merged.list || true
          git rm -f rule/Clash/Gemini_Merged.list || true
          # 添加 rule/Merged 目录下的文件
          git add rule/Merged/Gemini_Merged.list
          git commit -m "Auto update Gemini rules to rule/Merged/" || exit 0
          git push origin main
