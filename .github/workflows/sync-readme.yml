name: Sync README Content

on:
  schedule:
    # 每天 UTC 时间 0:00 (北京时间早 8:00) 自动运行一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在 GitHub 页面手动点击触发

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run sync script
        run: python .github/py/sync_readme.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto sync OpenClash settings to README.md"
          branch: ${{ github.ref_name }}
