[custom]
; ==========================================================
; 1. 全局配置与 YAML 头文件注入
; ==========================================================
enable_rule_generator=true
overwrite_original_rules=true

; 基础端口与参数
custom_common_text=port: 7890
custom_common_text=socks-port: 7891
custom_common_text=redir-port: 7892
custom_common_text=mixed-port: 7893
custom_common_text=allow-lan: false
custom_common_text=mode: Rule
custom_common_text=log-level: info
custom_common_text=ipv6: false
custom_common_text=external-controller: 127.0.0.1:9090
custom_common_text=clash-for-android: {append-system-dns: false}

; 单行化 Hosts 配置
custom_common_text=hosts: {'mtalk.google.com': '108.177.125.188'}

; 单行化 DNS 及 Fake-IP 配置（解决缩进丢失与无法生成的问题）
custom_common_text=dns: {enable: true, listen: '127.0.0.1:53', ipv6: false, enhanced-mode: fake-ip, fake-ip-range: '198.10.0.1/16', default-nameserver: ['223.5.5.5', '119.29.29.29', '1.0.0.1'], nameserver: ['https://223.6.6.6/dns-query', 'https://rubyfish.cn/dns-query', 'https://dns.pub/dns-query'], fake-ip-filter: ['*.lan', 'stun.*.*.*', 'stun.*.*', 'time.windows.com', 'time.nist.gov', 'time.apple.com', 'time.asia.apple.com', '*.ntp.org.cn', '*.openwrt.pool.ntp.org', 'time1.cloud.tencent.com', 'time.ustc.edu.cn', 'pool.ntp.org', 'ntp.ubuntu.com', 'ntp.aliyun.com', 'ntp1.aliyun.com', 'ntp2.aliyun.com', 'ntp3.aliyun.com', 'ntp4.aliyun.com', 'ntp5.aliyun.com', 'ntp6.aliyun.com', 'ntp7.aliyun.com', 'time1.aliyun.com', 'time2.aliyun.com', 'time3.aliyun.com', 'time4.aliyun.com', 'time5.aliyun.com', 'time6.aliyun.com', 'time7.aliyun.com', '*.time.edu.cn', 'time1.apple.com', 'time2.apple.com', 'time3.apple.com', 'time4.apple.com', 'time5.apple.com', 'time6.apple.com', 'time7.apple.com', 'time1.google.com', 'time2.google.com', 'time3.google.com', 'time4.google.com', 'music.163.com', '*.music.163.com', '*.126.net', 'musicapi.taihe.com', 'music.taihe.com', 'songsearch.kugou.com', 'trackercdn.kugou.com', '*.kuwo.cn', 'api-jooxtt.sanook.com', 'api.joox.com', 'joox.com', 'y.qq.com', '*.y.qq.com', 'streamoc.music.tc.qq.com', 'mobileoc.music.tc.qq.com', 'isure.stream.qqmusic.qq.com', 'dl.stream.qqmusic.qq.com', 'aqqmusic.tc.qq.com', 'amobile.music.tc.qq.com', '*.xiami.com', '*.music.migu.cn', 'music.migu.cn', '*.msftconnecttest.com', '*.msftncsi.com', 'localhost.ptlogin2.qq.com', '*.*.*.srv.nintendo.net', '*.*.stun.playstation.net', 'xbox.*.*.microsoft.com', '*.ipv6.microsoft.com', '*.*.xboxlive.com']}

; ==========================================================
; 2. 规则集（自上而下金字塔优先级）
; ==========================================================

; --- 最高优先级：本地私网与局域网直连 ---
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve

; --- 核心直连防线：国内银行、金融、IoT与手动直连补丁 ---
ruleset=DIRECT,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Merged/Direct_Merged.list

; --- 核心代理防线：AI 专项 ---
ruleset=🧠 AI,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Merged/AI_Merged.list

; --- 核心直连防线：国内大流量下载及游戏域名直连 ---
ruleset=DIRECT,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Merged/CDN_Merged.list
ruleset=DIRECT,[]GEOSITE,category-games@cn

; --- 社交 & 通讯 ---
ruleset=📱 社交,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Merged/Social_Merged.list
ruleset=📱 社交,[]GEOSITE,category-communication
ruleset=📱 社交,[]GEOSITE,category-social-media-!cn
ruleset=📱 社交,[]GEOIP,telegram,no-resolve
ruleset=📱 社交,[]GEOIP,facebook,no-resolve
ruleset=📱 社交,[]GEOIP,twitter,no-resolve

; --- 影音流媒体 ---
ruleset=🎞️ YouTube,[]GEOSITE,youtube
ruleset=🎞️ YouTube,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Clash/YouTube_Video.list
ruleset=🎥 Netflix,[]GEOSITE,netflix
ruleset=🎥 Netflix,[]GEOIP,netflix,no-resolve
ruleset=🎵 Spotify,[]GEOSITE,spotify
ruleset=🎶 TikTok,[]GEOSITE,tiktok
ruleset=🎬 Disney+,[]GEOSITE,disney
ruleset=🎥 HBO,[]GEOSITE,hbo
ruleset=📺 Bahamut,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Bahamut/Bahamut.list
ruleset=📺 BiliBili港澳台,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Clash/Bilibili_HMT.list

; --- 谷歌专项 ---
ruleset=🇬 Google,[]GEOSITE,google
ruleset=🇬 Google,[]GEOIP,google,no-resolve

; --- 开发 & 常用工具 ---
ruleset=📘 GitHub,[]GEOSITE,github
ruleset=Ⓜ️ Microsoft,[]GEOSITE,microsoft
ruleset=🍎 Apple,[]GEOSITE,apple
ruleset=Ⓜ️ OneDrive,[]GEOSITE,onedrive
ruleset=🟥 Adobe,[]GEOSITE,adobe
ruleset=🟥 Adobe,[]GEOSITE,adobe-activation

; --- 游戏联机 ---
ruleset=🎮 Steam,[]GEOSITE,steam
ruleset=🕹️ 游戏,[]GEOSITE,category-games

; --- 功能组与非标端口 ---
ruleset=🔒 隐私 DNS,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Clash/Global_DNS.list
ruleset=🏠 我的群晖,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Clash/Synology_Proxy.list
ruleset=🔀 非标端口,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Clash/Custom_Port.list
ruleset=🌎 国外媒体,[]GEOSITE,category-entertainment

; --- 国外通用域名大包兜底 ---
ruleset=🌍 国外,[]GEOSITE,geolocation-!cn
ruleset=🌍 国外,clash-classic:https://raw.githubusercontent.com/VoGter0616/openclash2025/main/rule/Merged/Proxy_Merged.list

; --- 基础国内直连大包兜底 ---
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn,no-resolve

; --- 漏网之鱼 ---
ruleset=🐟 漏网之鱼,[]FINAL

; ==========================================================
; 3. 节点过滤
; ==========================================================
exclude=流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|官网地址|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Traffic|Reset|Remaining|Expire|Official|Website

; ==========================================================
; 4. 节点策略组配置
; ==========================================================
custom_proxy_group=🧭 手动选择`select`.*
custom_proxy_group=♻️ 自动选择`url-test`(?i)(港|hk|新加坡|sg|台|tw)`https://cp.cloudflare.com/generate_204`600,,50
custom_proxy_group=🧱 稳定兜底`fallback`(?i)(港|hk|日本|jp|新加坡|sg|台|tw|韩|kr|美|us)`https://www.gstatic.com/generate_204`300
custom_proxy_group=香港-自动`url-test`(广港|香港|HK|Hong Kong|🇭🇰|HongKong)`https://cp.cloudflare.com/generate_204`400,,100
custom_proxy_group=澳门-自动`url-test`(澳门|MO|Macau|Macao|🇲🇴)`https://cp.cloudflare.com/generate_204`400,,100
